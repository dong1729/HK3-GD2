<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1" >
    <title>Bài cơ bản chương 8 — Thực hành HTML</title>
    <link rel="icon" href="/du-an/assets/icon.svg" type="image/svg+xml" >
    <link rel="stylesheet" href="/du-an/assets/site.css" >
  </head>
  <body>
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <header>
      <nav aria-label="Bài học"><a href="/">Mục lục bài tập</a></nav>
    </header>
    <main id="main" tabindex="-1">
      <h1>Bài cơ bản chương 8</h1>
      <button type="button" id="them">Thêm vào giỏ</button>
      <p><label for="tim">Tìm sách</label><input id="tim" name="q" type="search" ></p>
      <p role="status" id="trang-thai"></p>
      <p>
        Nút gốc hỗ trợ Tab/Enter/Space; label gắn for/id giúp trình đọc màn hình và mở
        rộng vùng bấm.
      </p>
    </main>
    <footer><p>Bài thực hành Quyển 1 — Nguyễn Hoa Đông.</p></footer>
    <script>
      document
        .getElementById("them")
        .addEventListener(
          "click",
          () =>
            (document.getElementById("trang-thai").textContent =
              "Đã thêm sách vào giỏ minh họa."),
        );
    </script>
  </body>
</html>
