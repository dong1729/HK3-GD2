<!DOCTYPE html>
<html lang="$lang">
  <head>
    $head
  </head>
  <body>
    <a class="skip-link" href="#noi-dung">$skip</a>
    <!-- Phần đầu trang: tên nhà sách, menu và tìm kiếm. -->
    <header class="site-header">
      <a class="brand" href="/du-an/trang-chu"
        ><img src="/du-an/assets/icon.svg" alt="" width="32" height="32" > Nhà sách Sao
        Mai</a
      >
      <nav aria-label="$navlabel">
        <ul>
          $menu
        </ul>
      </nav>
      <form action="/du-an/danh-muc" method="get" role="search">
        <label for="tim-sach">$searchlabel</label
        ><input id="tim-sach" name="q" type="search" enterkeyhint="search" ><button
          type="submit"
        >
          $search
        </button>
      </form>
      <button type="button" popovertarget="gio-nho">
        $cartlabel (<span data-cart-count>0</span>)
      </button>
    </header>
    $breadcrumb
    <!-- Nội dung riêng của từng trang được đặt trong main. -->
    <main id="noi-dung" tabindex="-1">$main</main>
    <!-- Thông tin liên hệ ở cuối trang. -->
    <footer class="site-footer">
      <p>© 2026 Nhà sách Sao Mai · $demo</p>
      <address>
        <a href="mailto:hotro@sachsaomai.example">hotro@sachsaomai.example</a>
      </address>
      <a
        href="https://html.spec.whatwg.org/"
        target="_blank"
        rel="noopener noreferrer external"
        >HTML Standard ($newtab)</a
      >
    </footer>
    <p
      role="status"
      aria-live="polite"
      aria-atomic="true"
      id="thong-bao"
      class="status"
    ></p>
    <aside id="gio-nho" popover aria-label="$minicart">
      <h2>$cartlabel</h2>
      <p data-cart-summary>$empty</p>
      <a href="/du-an/gio-hang">$viewcart</a
      ><button type="button" popovertarget="gio-nho" popovertargetaction="hide">
        $close
      </button>
    </aside>
    <dialog id="xem-nhanh" aria-labelledby="ten-hop">
      <h2 id="ten-hop">$quick</h2>
      <p id="noi-dung-hop"></p>
      <form method="dialog"><button type="submit">$close</button></form>
    </dialog>
  </body>
</html>
