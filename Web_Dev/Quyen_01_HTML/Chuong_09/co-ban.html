<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1" >
    <title>Bài cơ bản chương 9 — Thực hành HTML</title>
    <link rel="icon" href="/du-an/assets/icon.svg" type="image/svg+xml" >
    <link rel="stylesheet" href="/du-an/assets/site.css" >
    <meta
      name="description"
      content="Sách Lập trình Web căn bản của Nhóm Sao Mai, giá minh họa 98.000 đồng."
    >
    <link rel="canonical" href="https://sachsaomai.example/du-an/chi-tiet" >
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Book",
        "name": "Lập trình Web căn bản",
        "author": { "@type": "Organization", "name": "Nhóm Sao Mai" },
        "image": "https://sachsaomai.example/du-an/assets/web-1200.jpg",
        "offers": { "@type": "Offer", "price": "98000", "priceCurrency": "VND" }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <header>
      <nav aria-label="Bài học"><a href="/">Mục lục bài tập</a></nav>
    </header>
    <main id="main" tabindex="-1">
      <h1>Bài cơ bản chương 9</h1>
      <article>
        <h2>Lập trình Web căn bản</h2>
        <p>Tác giả: Nhóm Sao Mai. Giá: 98.000 đ.</p>
        <picture
          ><source
            type="image/avif"
            srcset="
              /du-an/assets/web-400.avif   400w,
              /du-an/assets/web-800.avif   800w,
              /du-an/assets/web-1200.avif 1200w
            "
            sizes="(max-width: 640px) calc(100vw - 40px), 400px" >
          <source
            type="image/webp"
            srcset="
              /du-an/assets/web-400.webp   400w,
              /du-an/assets/web-800.webp   800w,
              /du-an/assets/web-1200.webp 1200w
            "
            sizes="(max-width: 640px) calc(100vw - 40px), 400px" >
          <img
            src="/du-an/assets/web-800.jpg"
            srcset="
              /du-an/assets/web-400.jpg   400w,
              /du-an/assets/web-800.jpg   800w,
              /du-an/assets/web-1200.jpg 1200w
            "
            sizes="(max-width: 640px) calc(100vw - 40px), 400px"
            alt="Bìa sách Lập trình Web căn bản"
            width="800"
            height="1000"
            fetchpriority="high"
            decoding="async"
        ></picture>
      </article>
      <p>
        title mô tả nội dung; description nêu giá trị; canonical chọn URL chính. Book
        JSON-LD phải khớp nội dung hiển thị.
      </p>
    </main>
    <footer><p>Bài thực hành Quyển 1 — Nguyễn Hoa Đông.</p></footer>
  </body>
</html>
