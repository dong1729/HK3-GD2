<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1" >
    <title>Bài cơ bản chương 4 — Thực hành HTML</title>
    <link rel="icon" href="/du-an/assets/icon.svg" type="image/svg+xml" >
    <link rel="stylesheet" href="/du-an/assets/site.css" >
  </head>
  <body>
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <header>
      <nav aria-label="Bài học"><a href="/">Mục lục bài tập</a></nav>
    </header>
    <main id="main" tabindex="-1">
      <h1>Bài cơ bản chương 4</h1>
      <nav aria-label="Điều hướng sách">
        <ul>
          <li><a href="/du-an/danh-muc">Danh mục</a></li>
          <li><a href="/du-an/chi-tiet">Chi tiết sách</a></li>
        </ul>
      </nav>
      <button type="button" id="them">Thêm sách minh họa</button>
      <p role="status" id="trang-thai"></p>
      <p>Liên kết nội bộ dùng gốc site; nút thao tác không dùng a href=#.</p>
    </main>
    <footer><p>Bài thực hành Quyển 1 — Nguyễn Hoa Đông.</p></footer>
    <script>
      document
        .getElementById("them")
        .addEventListener(
          "click",
          () =>
            (document.getElementById("trang-thai").textContent =
              "Đã thêm sách minh họa."),
        );
    </script>
  </body>
</html>
